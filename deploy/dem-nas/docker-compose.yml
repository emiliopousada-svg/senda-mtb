services:
  senda-dem:
    image: nginx:1.27-alpine
    container_name: senda-dem
    restart: unless-stopped
    ports:
      - "8092:8080"
    volumes:
      - ${DEM_DATA_PATH:-./data}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
