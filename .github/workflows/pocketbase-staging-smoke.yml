name: PocketBase staging smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-smoke:
    runs-on: ubuntu-24.04
    environment:
      name: pocketbase-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check staging PocketBase
        env:
          MTB_STAGING_SERVER: ${{ vars.MTB_STAGING_SERVER }}
          PB_STAGING_SMOKE_EMAIL: ${{ secrets.PB_STAGING_SMOKE_EMAIL }}
          PB_STAGING_SMOKE_PASSWORD: ${{ secrets.PB_STAGING_SMOKE_PASSWORD }}
        run: npm run test:pocketbase:staging
