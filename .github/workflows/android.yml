name: Android signed APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    env:
      MTB_SIGNING_STORE_PASSWORD: ${{ secrets.MTB_SIGNING_STORE_PASSWORD }}
      MTB_SIGNING_KEY_ALIAS: ${{ secrets.MTB_SIGNING_KEY_ALIAS }}
      MTB_SIGNING_KEY_PASSWORD: ${{ secrets.MTB_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG must match package version v$APP_VERSION."
            exit 1
          fi
      - name: Run test suite
        run: npm test
      - name: Prepare Capacitor Android project
        run: npm run build
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MTB_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MTB_SIGNING_STORE_PASSWORD" ] || [ -z "$MTB_SIGNING_KEY_ALIAS" ] || [ -z "$MTB_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Configure all MTB_SIGNING_* repository secrets before building a signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/senda-mtb-signing.keystore"
          chmod 600 "$RUNNER_TEMP/senda-mtb-signing.keystore"
          echo "MTB_SIGNING_STORE_FILE=$RUNNER_TEMP/senda-mtb-signing.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/senda-mtb-signing.keystore" -storepass "$MTB_SIGNING_STORE_PASSWORD" -alias "$MTB_SIGNING_KEY_ALIAS"
      - name: Assemble signed release APK
        run: gradle -p android assembleRelease -PandroidBuildNumber=${{ github.run_number }}
      - name: Prepare APK artifact
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          APK_PATH="$RUNNER_TEMP/senda-mtb-v$APP_VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: senda-mtb-release-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/senda-mtb-v*.apk
          retention-days: 30
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "senda-mtb $APP_VERSION" \
              --generate-notes \
              --verify-tag
          fi
      - name: Bump patch version for next release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          export RELEASE_VERSION
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main refs/remotes/origin/main
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::notice::Main is at $CURRENT_VERSION, not $RELEASE_VERSION; skipping automatic version bump."
            exit 0
          fi
          npm version patch --no-git-tag-version
          NEXT_VERSION="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("node:fs");
            const previous = process.env.RELEASE_VERSION;
            const next = require("./package.json").version;
            for (const file of ["README.md", "app/config.js"]) {
              const content = fs.readFileSync(file, "utf8");
              if (!content.includes(previous)) {
                throw new Error(`Could not find ${previous} in ${file}`);
              }
              fs.writeFileSync(file, content.split(previous).join(next));
            }
          '
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md app/config.js
          git commit -m "chore: prepare v$NEXT_VERSION release"
          git push origin main

