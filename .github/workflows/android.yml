name: Android signed APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    env:
      MTB_SIGNING_STORE_PASSWORD: ${{ secrets.MTB_SIGNING_STORE_PASSWORD }}
      MTB_SIGNING_KEY_ALIAS: ${{ secrets.MTB_SIGNING_KEY_ALIAS }}
      MTB_SIGNING_KEY_PASSWORD: ${{ secrets.MTB_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG must match package version v$APP_VERSION."
            exit 1
          fi
      - name: Run test suite
        run: npm test
      - name: Prepare Capacitor Android project
        run: npm run build
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MTB_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MTB_SIGNING_STORE_PASSWORD" ] || [ -z "$MTB_SIGNING_KEY_ALIAS" ] || [ -z "$MTB_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Configure all MTB_SIGNING_* repository secrets before building a signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/senda-brava-signing.keystore"
          chmod 600 "$RUNNER_TEMP/senda-brava-signing.keystore"
          echo "MTB_SIGNING_STORE_FILE=$RUNNER_TEMP/senda-brava-signing.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/senda-brava-signing.keystore" -storepass "$MTB_SIGNING_STORE_PASSWORD" -alias "$MTB_SIGNING_KEY_ALIAS"
      - name: Assemble signed release APK
        run: gradle -p android assembleRelease -PandroidBuildNumber=${{ github.run_number }}
      - name: Prepare APK artifact
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          APK_PATH="$RUNNER_TEMP/senda-brava-v$APP_VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: senda-brava-release-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/senda-brava-v*.apk
          retention-days: 30
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "senda-brava $APP_VERSION" \
              --generate-notes \
              --verify-tag
          fi
