name: Android signed APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME must point to a commit on main."
            exit 1
          fi
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG must match package version v$APP_VERSION."
            exit 1
          fi
      - name: Run test suite
        run: npm test
      - name: Prepare Capacitor Android project
        run: npm run build
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MTB_SIGNING_KEYSTORE_BASE64 }}
          MTB_SIGNING_STORE_PASSWORD: ${{ secrets.MTB_SIGNING_STORE_PASSWORD }}
          MTB_SIGNING_KEY_ALIAS: ${{ secrets.MTB_SIGNING_KEY_ALIAS }}
          MTB_SIGNING_KEY_PASSWORD: ${{ secrets.MTB_SIGNING_KEY_PASSWORD }}
          MTB_SIGNING_CERT_SHA256: ${{ vars.MTB_SIGNING_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MTB_SIGNING_STORE_PASSWORD" ] || [ -z "$MTB_SIGNING_KEY_ALIAS" ] || [ -z "$MTB_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Configure all MTB_SIGNING_* repository secrets before building a signed APK."
            exit 1
          fi
          if [ "$MTB_SIGNING_STORE_PASSWORD" = "android" ] || [ "$MTB_SIGNING_KEY_PASSWORD" = "android" ] || [ "$MTB_SIGNING_KEY_ALIAS" = "androiddebugkey" ]; then
            echo "::error::Release signing must use a dedicated keystore, alias, and non-default passwords."
            exit 1
          fi
          if [ "${#MTB_SIGNING_STORE_PASSWORD}" -lt 16 ] || [ "${#MTB_SIGNING_KEY_PASSWORD}" -lt 16 ]; then
            echo "::error::Release signing passwords must contain at least 16 characters."
            exit 1
          fi
          if [ -z "$MTB_SIGNING_CERT_SHA256" ]; then
            echo "::error::Set the MTB_SIGNING_CERT_SHA256 Actions variable to the new release certificate fingerprint."
            exit 1
          fi
          EXPECTED_CERT_SHA256="$(printf '%s' "$MTB_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$EXPECTED_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::MTB_SIGNING_CERT_SHA256 must contain exactly 64 hexadecimal characters."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/senda-mtb-signing.keystore"
          chmod 600 "$RUNNER_TEMP/senda-mtb-signing.keystore"
          echo "MTB_SIGNING_STORE_FILE=$RUNNER_TEMP/senda-mtb-signing.keystore" >> "$GITHUB_ENV"
          CERT_SHA256="$(keytool -exportcert -keystore "$RUNNER_TEMP/senda-mtb-signing.keystore" -storepass "$MTB_SIGNING_STORE_PASSWORD" -alias "$MTB_SIGNING_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)"
          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Release certificate fingerprint does not match MTB_SIGNING_CERT_SHA256."
            exit 1
          fi
          echo "Verified release signing certificate fingerprint."
      - name: Assemble signed release APK
        env:
          MTB_SIGNING_STORE_PASSWORD: ${{ secrets.MTB_SIGNING_STORE_PASSWORD }}
          MTB_SIGNING_KEY_ALIAS: ${{ secrets.MTB_SIGNING_KEY_ALIAS }}
          MTB_SIGNING_KEY_PASSWORD: ${{ secrets.MTB_SIGNING_KEY_PASSWORD }}
        run: gradle -p android assembleRelease -PandroidBuildNumber=${{ github.run_number }}
      - name: Prepare APK artifact
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          APK_PATH="$RUNNER_TEMP/senda-mtb-v$APP_VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: senda-mtb-release-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/senda-mtb-v*.apk
          retention-days: 30
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "senda-mtb $APP_VERSION" \
              --generate-notes \
              --verify-tag
          fi
      - name: Bump patch version for next release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          export RELEASE_VERSION
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main refs/remotes/origin/main
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::notice::Main is at $CURRENT_VERSION, not $RELEASE_VERSION; skipping automatic version bump."
            exit 0
          fi
          npm version patch --no-git-tag-version
          NEXT_VERSION="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("node:fs");
            const previous = process.env.RELEASE_VERSION;
            const next = require("./package.json").version;
            const quote = String.fromCharCode(39);
            const replacements = [
              ["README.md", `Versión indicada en el proyecto: **${previous}**`, `Versión indicada en el proyecto: **${next}**`],
              ["app/config.js", `const APP_VERSION = ${quote}${previous}${quote};`, `const APP_VERSION = ${quote}${next}${quote};`]
            ];
            for (const [file, before, after] of replacements) {
              const content = fs.readFileSync(file, "utf8");
              const occurrences = content.split(before).length - 1;
              if (occurrences !== 1) {
                throw new Error(`Expected exactly one version marker in ${file}, found ${occurrences}`);
              }
              fs.writeFileSync(file, content.replace(before, after));
            }
          '
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md app/config.js
          git commit -m "chore: prepare v$NEXT_VERSION release [release-only]"
      - name: Push next patch version to main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin main

