name: Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    env:
      MTB_SIGNING_STORE_PASSWORD: ${{ secrets.MTB_SIGNING_STORE_PASSWORD }}
      MTB_SIGNING_KEY_ALIAS: ${{ secrets.MTB_SIGNING_KEY_ALIAS }}
      MTB_SIGNING_KEY_PASSWORD: ${{ secrets.MTB_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install dependencies
        run: npm ci
      - name: Prepare Capacitor Android project
        run: npm run build
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MTB_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MTB_SIGNING_STORE_PASSWORD" ] || [ -z "$MTB_SIGNING_KEY_ALIAS" ] || [ -z "$MTB_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Configure all MTB_SIGNING_* repository secrets before building an updateable APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mtbpro-signing.keystore"
          echo "MTB_SIGNING_STORE_FILE=$RUNNER_TEMP/mtbpro-signing.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/mtbpro-signing.keystore" -storepass "$MTB_SIGNING_STORE_PASSWORD" -alias "$MTB_SIGNING_KEY_ALIAS"
      - name: Assemble Android debug APK
        run: gradle -p android assembleDebug -PandroidBuildNumber=${{ github.run_number + 1 }}
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MTBPro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
