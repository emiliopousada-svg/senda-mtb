name: MTBPro checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install dependencies
        run: npm ci
      - name: Run statistics tests
        run: npm run test:statistics
      - name: Run community performance tests
        run: npm run test:community
      - name: Prepare Capacitor Android project
        run: npm run build
      - name: Assemble Android debug APK
        run: gradle -p android assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MTBPro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
