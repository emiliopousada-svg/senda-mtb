name: senda-mtb checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'test/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Prepare Capacitor Android project
        run: npm run build
      - name: Assemble Android debug APK
        run: gradle -p android assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: senda-mtb-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

