name: senda-mtb checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'test/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Prepare Capacitor Android project
        run: npm run build
      - name: Assemble Android debug APK
        run: gradle -p android assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: senda-mtb-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

